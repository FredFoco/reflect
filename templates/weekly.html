{% extends 'base.html' %}
{% block content %}
  <div class="card">
    <h2 style="margin-top:0">Weekly Reflection</h2>
    <p class="muted">{{ reflection }}</p>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Tag Correlations</h3>
    <ul>
    {% for t in tag_corr %}
      <li class="muted">{{ t.name }} — avg mood: {{ t.avg_mood|round(2) }}, count: {{ t.cnt }}</li>
    {% else %}
      <li class="muted">No tag data for this week.</li>
    {% endfor %}
    </ul>
  </div>
{% endblock %}
