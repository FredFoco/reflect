{% extends 'base.html' %}
{% block content %}
  <div style="max-width: 400px; margin: 60px auto; padding: 0 16px;">
    <div class="card">
      <h2 style="margin-top: 0; margin-bottom: 28px; text-align: center; font-weight: 300; font-size: 28px;">Login</h2>
      <form method="post" class="form">
        <div class="row">
          <label>Username</label>
          <input class="input" name="username" type="text" required>
        </div>
        <div class="row">
          <label>Password</label>
          <input class="input" name="password" type="password" required>
        </div>
        <button type="submit" style="margin-top: 12px; width: 100%;">Login</button>
      </form>
      <p style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted);">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Register here</a>
      </p>
    </div>
  </div>
{% endblock %}
